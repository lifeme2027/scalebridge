name: web

# ScaleBridge Web（web/，原生 ES modules，零运行时依赖）。独立于 .NET CI；
# 只在 web/、shared-vectors/ 或本文件变动时运行。
on:
  push:
    branches: [main]
    paths: ['web/**', 'shared-vectors/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'shared-vectors/**', '.github/workflows/web.yml']

jobs:
  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 单元测试（含 shared-vectors 全部向量，读取仓库根目录同一份 JSON）
        run: npm test
      - name: 构建（带内容哈希的静态产物）
        run: npm run build
